[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffapp"
version = "0.1.0"
description = "Differential approximants for asymptotic analysis of power series"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mpmath>=1.3",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.scripts]
diffapp = "diffapp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
